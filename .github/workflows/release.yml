name: Release

# Publishing is a deliberate act (PLAN.md section 10, docs/RELEASE.md):
#
#   * the workflow runs for a `v*` tag, or a manual dispatch that only builds (push_images=false);
#   * the GHCR push needs the repository's GITHUB_TOKEN with `packages: write` — nothing is
#     published by a branch push or by CI;
#   * the GitHub release needs `contents: write`;
#   * a tag that does not match the manifest version is refused before anything is built.
#
# Images are built natively per architecture (Rust cross builds under QEMU are slow and OOM-prone):
# ubuntu-24.04 for amd64, ubuntu-24.04-arm for aarch64. The arm runners are available for public
# repositories; for a private fork, replace the aarch64 row with ubuntu-24.04 + `--platform
# linux/arm64` and add docker/setup-qemu-action (accept the slower build).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to ghcr.io (needs packages:write)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version lockstep
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Workspace, Cargo.lock and manifest agree
        run: scripts/bump_version.sh --check
      - name: Read the version
        id: version
        run: echo "version=$(scripts/bump_version.sh --show)" >>"$GITHUB_OUTPUT"
      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "tag v$tag does not match version $VERSION" >&2
            echo "run scripts/bump_version.sh $tag, merge, then tag that commit" >&2
            exit 1
          fi

  # The tag is built from a commit that already passed CI; prove it here again rather than trusting
  # a branch.
  gates:
    name: Gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: check_structure.py
        run: python3 scripts/check_structure.py

  image:
    name: Image ${{ matrix.ha_arch }}
    needs: [version, gates]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            ha_arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            ha_arch: aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUSH_IMAGES: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.push_images == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI (rust-embed embeds web/dist)
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (push only)
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the add-on image
        env:
          HA_ARCH: ${{ matrix.ha_arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/energy-rs-${HA_ARCH}:${VERSION}"
          echo "IMAGE=${image}" >>"$GITHUB_ENV"
          args=(
            --platform "${PLATFORM}"
            -f energy_rs/Dockerfile
            --build-arg "BUILD_VERSION=${VERSION}"
            --build-arg "BUILD_ARCH=${HA_ARCH}"
            -t "${image}"
          )
          if [ "${PUSH_IMAGES}" = "true" ]; then
            args+=(--push)
          else
            args+=(--load)
          fi
          docker buildx build "${args[@]}" .
      - name: Smoke test the image
        # Runs for published images too: a `--push` build leaves nothing in the local store, so the
        # image is pulled back from GHCR first. That also proves the tag is really pullable, which
        # the add-on depends on.
        #
        # The add-on cannot serve `/api/v1/health` without Home Assistant, so the check is two
        # honest halves: the image runs and reports the release version, and bootstrap reaches the
        # documented "no Home Assistant transport" failure instead of crashing. A full health probe
        # needs a fake HA and lives in the crate's integration tests, not here.
        run: |
          if [ "${PUSH_IMAGES}" = "true" ]; then
            docker pull "${IMAGE}"
          fi
          docker run --rm --entrypoint /usr/local/bin/energy-server "${IMAGE}" --version \
            | tee /tmp/energy-rs-version.txt
          grep -q "energy-server ${VERSION}" /tmp/energy-rs-version.txt \
            || { echo "the image is not stamped ${VERSION}" >&2; exit 1; }

          data="$(mktemp -d)"
          printf '{"mode":"dry_run","log_level":"info","price_provider":"auto","batteries":"[]"}' \
            >"${data}/options.json"
          status=0
          out="$(docker run --rm -v "${data}:/data" "${IMAGE}" 2>&1)" || status=$?
          printf '%s\n' "${out}"
          grep -q "energy-server starting" <<<"${out}" \
            || { echo "the add-on did not start (exit ${status})" >&2; exit 1; }
          grep -q "no Home Assistant transport" <<<"${out}" \
            || { echo "bootstrap did not reach the HA transport check" >&2; exit 1; }
          [ "${status}" -ne 0 ] \
            || { echo "bootstrap without Home Assistant must fail fast" >&2; exit 1; }

  # The add-on tarball is the Supervisor's build context: a self-contained folder that can be built
  # on the device when the published image is not wanted.
  release:
    name: Add-on tarball and GitHub release
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build
      - name: Stage the add-on folder
        run: scripts/stage_addon.sh build/energy_rs
      - name: Pack the tarball
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C build -czf "energy-rs-addon-${VERSION}.tar.gz" energy_rs
      - uses: actions/upload-artifact@v4
        with:
          name: energy-rs-addon-${{ needs.version.outputs.version }}
          path: energy-rs-addon-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: energy-rs-addon-${{ needs.version.outputs.version }}.tar.gz
          generate_release_notes: true
          body: |
            Energy RS add-on ${{ needs.version.outputs.version }}.

            **Home Assistant (recommended).** Add `https://github.com/yazdannl/energy-rs` as an
            add-on repository and install **Energy RS**: it pulls
            `ghcr.io/yazdannl/energy-rs-{arch}:${{ needs.version.outputs.version }}`.

            **Local build.** Extract `energy-rs-addon-${{ needs.version.outputs.version }}.tar.gz` and
            copy the `energy_rs/` folder to `/addons/energy_rs` (Home Assistant OS) or the `addons`
            folder of a Supervised install. The folder is a complete build context, so the
            Supervisor can compile it on the device — several minutes, plus a Rust builder pull.

            **Images.** `ghcr.io/yazdannl/energy-rs-amd64:${{ needs.version.outputs.version }}`,
            `ghcr.io/yazdannl/energy-rs-aarch64:${{ needs.version.outputs.version }}`.

            Defaults to `mode: dry_run`; nothing is written to a battery until that is changed.
