[workspace]
resolver = "3"
members = [
    "crates/energy-opt",
    "crates/energy-ha",
    "crates/energy-price",
    "crates/energy-forecast",
    "crates/energy-battery",
    "crates/energy-ledger",
    "crates/energy-core",
    "crates/energy-server",
]

[workspace.package]
version = "0.9.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Energy RS contributors"]
repository = "https://github.com/yazdannl/energy-rs"

# Workspace lint policy.  Every crate opts in with `[lints] workspace = true`; see
# docs/LINTING.md for the rules and for how to justify an exception.
#
# Group lints carry `priority = -1` so the named overrides below win.
[workspace.lints.rust]
# A denied/ignored return value is the classic silently-dropped error.
unused_must_use = "deny"
# `unsafe fn` bodies must keep their own `unsafe` blocks explicit (the FFI shim is the only user).
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Hard refusals: an optimizer that plans battery writes must not have a reachable panic path.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

# Hard refusals: the size limits are enforced here as well as in scripts/check_structure.py.
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
large_enum_variant = "deny"

# Justified allowances (each reason is in docs/LINTING.md).
# Naming style only; domain names read better with the module prefix (`client::Client`).
module_name_repetitions = "allow"
# Public items are documented by hand where it matters; not every getter needs a `#[must_use]`.
must_use_candidate = "allow"
# Errors are documented in the module docs and typed with thiserror; per-variant prose is noise.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# f64/int conversions are the domain: slot counts, power steps and array indices.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
# Numeric code reuses shapes on purpose (`e_now`/`e_next`, `lo`/`hi`); renaming hurts review.
similar_names = "allow"
# Doc comments quote C sources and identifiers that are not Rust items.
doc_markdown = "allow"

[workspace.dependencies]
# Internal crates (layered: core -> server, everything below is a leaf).
energy-battery = { path = "crates/energy-battery" }
energy-core = { path = "crates/energy-core" }
energy-forecast = { path = "crates/energy-forecast" }
energy-ha = { path = "crates/energy-ha" }
energy-ledger = { path = "crates/energy-ledger" }
energy-opt = { path = "crates/energy-opt" }
energy-price = { path = "crates/energy-price" }
energy-server = { path = "crates/energy-server" }

# Third-party versions resolved with `cargo add` against crates.io and validated by `cargo build`.
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
mdns-sd = "0.21.7"
pretty_assertions = "1.4.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-rusqlite = "0.8.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
